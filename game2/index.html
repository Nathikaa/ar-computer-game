<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกม AR จับคู่อุปกรณ์คอมพิวเตอร์</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #fff;
    }

    #webcam-container {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
    }
    #webcam {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #gameCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
    }

    #ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding: 16px 24px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 22px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 28px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    #start-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .start-btn {
      padding: 16px 44px;
      font-size: 24px;
      font-weight: bold;
      background: #8b5cf6;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.5);
      transition: 0.2s;
    }
    .start-btn:hover { background: #7c3aed; transform: scale(1.05); }
  </style>

  <!-- MediaPipe Hands CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="webcam-container">
    <video id="webcam" autoplay playsinline></video>
  </div>
  <canvas id="gameCanvas"></canvas>

  <div id="ui-layer">
    <div class="top-bar">
      <div id="score-text">⭐ คะแนน: 0</div>
      <div style="color: #cbd5e1; font-size: 16px;">💡 ยกนิ้วชี้แตะ "ภาพ" แล้วไปแตะ "ชื่อ" ให้ตรงกัน</div>
      <div id="timer-text" style="color: #38bdf8;">⏳ เวลา: 02:00</div>
    </div>
    <div></div>
  </div>

  <div id="start-overlay">
    <h1 style="font-size: 38px; margin-bottom: 12px;">🧩 AR Matching: จับคู่อุปกรณ์คอมพิวเตอร์</h1>
    <p style="font-size: 18px; color: #cbd5e1; margin-bottom: 24px; text-align: center; max-width: 540px; line-height: 1.6;">
      ภารกิจท้าทายความเร็ว <b>2 นาที!</b><br>
      ยกนิ้วชี้ขึ้นมาหน้ากล้อง แตะค้างที่ <b>การ์ดรูปภาพ</b> แล้วไปแตะ <b>การ์ดชื่อ</b> ที่คู่กัน
    </p>
    <button class="start-btn" id="start-btn">เริ่มจับคู่ (2 นาที)</button>
  </div>

  <script>
    // คลังข้อมูลฮาร์ดแวร์คอมพิวเตอร์ 20 ชนิด
    const hardwareDatabase = [
      { id: 'kb', icon: '⌨️', name: 'แป้นพิมพ์ (Keyboard)' },
      { id: 'mouse', icon: '🖱️', name: 'เมาส์ (Mouse)' },
      { id: 'monitor', icon: '🖥️', name: 'จอภาพ (Monitor)' },
      { id: 'speaker', icon: '🔊', name: 'ลำโพง (Speaker)' },
      { id: 'printer', icon: '🖨️', name: 'เครื่องพิมพ์ (Printer)' },
      { id: 'mic', icon: '🎙️', name: 'ไมโครโฟน (Microphone)' },
      { id: 'headphone', icon: '🎧', name: 'หูฟัง (Headphone)' },
      { id: 'camera', icon: '📷', name: 'เว็บแคม (Webcam)' },
      { id: 'cpu', icon: '🔲', name: 'ซีพียู (CPU / Processor)' },
      { id: 'mainboard', icon: '🟩', name: 'เมนบอร์ด (Motherboard)' },
      { id: 'ram', icon: '📏', name: 'แรม (RAM Memory)' },
      { id: 'gpu', icon: '🎮', name: 'การ์ดแสดงผล (GPU)' },
      { id: 'hdd', icon: '💽', name: 'ฮาร์ดดิสก์ (Hard Disk)' },
      { id: 'flashdrive', icon: '💾', name: 'แฟลชไดรฟ์ (USB Drive)' },
      { id: 'powersupply', icon: '⚡', name: 'พาวเวอร์ซัพพลาย (PSU)' },
      { id: 'fan', icon: '🌀', name: 'พัดลมระบายความร้อน' },
      { id: 'router', icon: '📡', name: 'เราเตอร์ (Wi-Fi Router)' },
      { id: 'projector', icon: '📽️', name: 'โปรเจกเตอร์ (Projector)' },
      { id: 'lan', icon: '🔌', name: 'สายแลน (LAN Cable)' },
      { id: 'scanner', icon: '📑', name: 'สแกนเนอร์ (Scanner)' }
    ];

    let availablePool = [];
    let currentRoundItems = [];
    let imageCards = [];
    let nameCards = [];
    let selectedCard = null;

    let score = 0;
    let timeLeft = 120; // กำหนด 2 นาที (120 วินาที)
    let isPlaying = false;
    let hoverDuration = 0;
    const HOVER_THRESHOLD = 12; // ค้างนิ้วประมาณ 0.35 วิ
    let hoveredCard = null;

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('gameCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const scoreText = document.getElementById('score-text');
    const timerText = document.getElementById('timer-text');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');

    // ระบบเสียงสังเคราะห์
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playAudio(type) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'select') {
        osc.frequency.setValueAtTime(440, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'correct') {
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        osc.frequency.setValueAtTime(783.99, now + 0.16);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (type === 'wrong') {
        osc.frequency.setValueAtTime(200, now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      }
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
      calculateCardPositions();
    }
    window.addEventListener('resize', resizeCanvas);

    // สุ่มทีละ 3 ข้อ และไม่ซ้ำข้อเดิมจนกว่าจะหมดกอง
    function setupNewRound() {
      if (availablePool.length < 3) {
        availablePool = [...hardwareDatabase].sort(() => 0.5 - Math.random());
      }
      currentRoundItems = availablePool.splice(0, 3);

      const icons = currentRoundItems.map(item => ({ id: item.id, icon: item.icon, type: 'IMAGE', matched: false }));
      const names = currentRoundItems.map(item => ({ id: item.id, name: item.name, type: 'NAME', matched: false }));

      imageCards = icons.sort(() => 0.5 - Math.random());
      nameCards = names.sort(() => 0.5 - Math.random());
      selectedCard = null;
      calculateCardPositions();
    }

    function calculateCardPositions() {
      const w = canvasElement.width;
      const h = canvasElement.height;
      const cardW = Math.min(250, w * 0.35);
      const cardH = 110;
      const startY = h * 0.22;
      const gapY = cardH + 24;

      imageCards.forEach((c, i) => {
        c.x = 40;
        c.y = startY + (i * gapY);
        c.w = cardW;
        c.h = cardH;
      });

      nameCards.forEach((c, i) => {
        c.x = w - cardW - 40;
        c.y = startY + (i * gapY);
        c.w = cardW;
        c.h = cardH;
      });
    }

    function onResults(results) {
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      imageCards.forEach(card => drawCard(card));
      nameCards.forEach(card => drawCard(card));

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0 && isPlaying) {
        const indexTip = results.multiHandLandmarks[0][8];
        const tipX = (1 - indexTip.x) * canvasElement.width;
        const tipY = indexTip.y * canvasElement.height;

        // วาดพอยน์เตอร์ปลายนิ้ว
        canvasCtx.beginPath();
        canvasCtx.arc(tipX, tipY, 16, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#facc15';
        canvasCtx.fill();
        canvasCtx.lineWidth = 4;
        canvasCtx.strokeStyle = '#ffffff';
        canvasCtx.stroke();

        const allCards = [...imageCards, ...nameCards].filter(c => !c.matched);
        let currentHover = allCards.find(c => tipX >= c.x && tipX <= c.x + c.w && tipY >= c.y && tipY <= c.y + c.h);

        if (currentHover) {
          if (hoveredCard === currentHover) {
            hoverDuration++;
            drawLoadingCircle(tipX, tipY, hoverDuration / HOVER_THRESHOLD);
            if (hoverDuration >= HOVER_THRESHOLD) {
              handleCardClick(currentHover);
              hoverDuration = 0;
              hoveredCard = null;
            }
          } else {
            hoveredCard = currentHover;
            hoverDuration = 1;
          }
        } else {
          hoveredCard = null;
          hoverDuration = 0;
        }
      }
    }

    function handleCardClick(card) {
      if (!selectedCard) {
        selectedCard = card;
        playAudio('select');
      } else {
        if (selectedCard === card) {
          selectedCard = null;
          return;
        }

        if (selectedCard.type !== card.type) {
          if (selectedCard.id === card.id) {
            selectedCard.matched = true;
            card.matched = true;
            score += 10;
            scoreText.innerText = `⭐ คะแนน: ${score}`;
            playAudio('correct');
            selectedCard = null;

            const remaining = [...imageCards, ...nameCards].filter(c => !c.matched);
            if (remaining.length === 0) {
              setTimeout(setupNewRound, 400);
            }
          } else {
            score = Math.max(0, score - 3);
            scoreText.innerText = `⭐ คะแนน: ${score}`;
            playAudio('wrong');
            selectedCard = null;
          }
        } else {
          selectedCard = card;
          playAudio('select');
        }
      }
    }

    function drawCard(card) {
      if (card.matched) return;

      canvasCtx.save();
      const isSelected = selectedCard === card;

      canvasCtx.fillStyle = isSelected ? 'rgba(234, 179, 8, 0.4)' : 'rgba(15, 23, 42, 0.82)';
      canvasCtx.strokeStyle = isSelected ? '#facc15' : (card.type === 'IMAGE' ? '#38bdf8' : '#c084fc');
      canvasCtx.lineWidth = isSelected ? 5 : 3;

      canvasCtx.beginPath();
      canvasCtx.roundRect(card.x, card.y, card.w, card.h, 16);
      canvasCtx.fill();
      canvasCtx.stroke();

      canvasCtx.textAlign = 'center';
      canvasCtx.textBaseline = 'middle';

      if (card.type === 'IMAGE') {
        canvasCtx.font = '50px sans-serif';
        canvasCtx.fillText(card.icon, card.x + card.w / 2, card.y + card.h / 2);
      } else {
        canvasCtx.fillStyle = '#ffffff';
        canvasCtx.font = 'bold 17px sans-serif';
        canvasCtx.fillText(card.name, card.x + card.w / 2, card.y + card.h / 2);
      }
      canvasCtx.restore();
    }

    function drawLoadingCircle(x, y, progress) {
      canvasCtx.beginPath();
      canvasCtx.arc(x, y, 26, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * progress));
      canvasCtx.lineWidth = 5;
      canvasCtx.strokeStyle = '#22c55e';
      canvasCtx.stroke();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await hands.send({ image: videoElement }); },
      width: 1280, height: 720
    });

    startBtn.addEventListener('click', async () => {
      audioCtx.resume();
      startOverlay.style.display = 'none';
      await camera.start();
      isPlaying = true;
      resizeCanvas();
      setupNewRound();

      const timer = setInterval(() => {
        timeLeft--;
        timerText.innerText = `⏳ เวลา: ${formatTime(timeLeft)}`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          isPlaying = false;
          alert(`🎉 หมดเวลา 2 นาที!\nคุณทำคะแนนรวมได้: ${score} คะแนน`);
          location.reload();
        }
      }, 1000);
    });
  </script>
</body>
</html>
