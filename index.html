<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกม AR จำแนกอุปกรณ์คอมพิวเตอร์</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a2e;
      color: #fff;
    }

    #webcam-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 22px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 28px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
    }

    .question-box {
      align-self: center;
      background: rgba(15, 23, 42, 0.9);
      border: 3px solid #38bdf8;
      border-radius: 20px;
      padding: 20px 44px;
      text-align: center;
      margin-top: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .question-title { font-size: 18px; color: #94a3b8; margin-bottom: 6px; }
    .item-name { font-size: 34px; font-weight: 800; color: #facc15; }

    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 15, 30, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .start-btn {
      padding: 16px 44px;
      font-size: 24px;
      font-weight: bold;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5);
      transition: 0.2s;
    }
    .start-btn:hover { background: #0369a1; transform: scale(1.05); }
  </style>

  <!-- MediaPipe Hands CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="webcam-container">
    <video id="webcam" autoplay playsinline></video>
  </div>
  <canvas id="gameCanvas"></canvas>

  <div id="ui-layer">
    <div class="top-bar">
      <div id="score-text">⭐ คะแนน: 0</div>
      <div id="timer-text" style="color: #38bdf8;">⏳ เวลา: 02:00</div>
    </div>
    <div class="question-box">
      <div class="question-title">อุปกรณ์นี้เป็นหน่วยประเภทใด?</div>
      <div class="item-name" id="current-item">เตรียมตัว...</div>
    </div>
    <div></div>
  </div>

  <div id="start-overlay">
    <h1 style="font-size: 36px; margin-bottom: 10px;">🎮 เกม AR ฮาร์ดแวร์คอมพิวเตอร์</h1>
    <p style="font-size: 18px; color: #cbd5e1; margin-bottom: 24px; text-align: center; max-width: 520px; line-height: 1.6;">
      ท้าทายความเร็ว <b>2 นาที!</b><br>
      ยกนิ้วชี้ของคุณขึ้นมา แล้วชี้ไปที่กล่องคำตอบ <b>"หน่วยรับเข้า (Input)"</b> หรือ <b>"หน่วยส่งออก (Output)"</b> ให้ถูกต้อง!
    </p>
    <button class="start-btn" id="start-btn">เริ่มเล่นเกม (2 นาที)</button>
  </div>

  <script>
    // คลังข้อสอบอุปกรณ์คอมพิวเตอร์ 24 ข้อ
    const questionsDatabase = [
      // หน่วยรับเข้า (Input - LEFT)
      { name: "แป้นพิมพ์ (Keyboard)", type: "LEFT" },
      { name: "เมาส์ (Mouse)", type: "LEFT" },
      { name: "ไมโครโฟน (Microphone)", type: "LEFT" },
      { name: "สแกนเนอร์ (Scanner)", type: "LEFT" },
      { name: "เว็บแคม (Webcam)", type: "LEFT" },
      { name: "ทัชแพด (Touchpad)", type: "LEFT" },
      { name: "จอยสติ๊ก (Joystick)", type: "LEFT" },
      { name: "เครื่องอ่านบาร์โค้ด (Barcode Reader)", type: "LEFT" },
      { name: "ปากกาสไตลัส (Stylus Pen)", type: "LEFT" },
      { name: "เซนเซอร์สแกนลายนิ้วมือ", type: "LEFT" },
      { name: "กล้องดิจิทัล (Digital Camera)", type: "LEFT" },
      { name: "แผ่นกระดานวาดรูป (Drawing Tablet)", type: "LEFT" },

      // หน่วยส่งออก (Output - RIGHT)
      { name: "จอภาพ (Monitor)", type: "RIGHT" },
      { name: "ลำโพง (Speaker)", type: "RIGHT" },
      { name: "เครื่องพิมพ์ (Printer)", type: "RIGHT" },
      { name: "โปรเจกเตอร์ (Projector)", type: "RIGHT" },
      { name: "หูฟัง (Headphone)", type: "RIGHT" },
      { name: "หูฟังแบบเอียร์บัด (Earbuds)", type: "RIGHT" },
      { name: "พล็อตเตอร์ (Plotter)", type: "RIGHT" },
      { name: "เครื่องพิมพ์ 3 มิติ (3D Printer)", type: "RIGHT" },
      { name: "จอสัมผัสแสดงผล (Display Output)", type: "RIGHT" },
      { name: "ไฟสถานะ LED บนเคส", type: "RIGHT" },
      { name: "ซาวด์การ์ดขยายเสียงภายนอก", type: "RIGHT" },
      { name: "เครื่องพิมพ์สลิป/ใบเสร็จ", type: "RIGHT" }
    ];

    let questionPool = [];
    let currentQuestion = null;
    let score = 0;
    let timeLeft = 120; // 2 นาที (120 วินาที)
    let isPlaying = false;
    let targetX = null, targetY = null;
    let holdDuration = 0;
    const HOLD_THRESHOLD = 8; // ปรับลดให้แตะติดไวขึ้น (~0.25 วิ)
    let selectedBox = null;

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('gameCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const scoreText = document.getElementById('score-text');
    const timerText = document.getElementById('timer-text');
    const currentItemText = document.getElementById('current-item');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');

    // ระบบเสียงสังเคราะห์
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(isCorrect) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (isCorrect) {
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880.00, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else {
        osc.frequency.setValueAtTime(200, now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      }
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function nextQuestion() {
      if (questionPool.length === 0) {
        questionPool = [...questionsDatabase].sort(() => 0.5 - Math.random());
      }
      currentQuestion = questionPool.pop();
      currentItemText.innerText = currentQuestion.name;
    }

    function onResults(results) {
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      const boxW = Math.min(230, canvasElement.width * 0.28);
      const boxH = 190;
      const leftBox = { x: 35, y: canvasElement.height / 2 - boxH / 2, w: boxW, h: boxH, title: "หน่วยรับเข้า", sub: "(Input)" };
      const rightBox = { x: canvasElement.width - boxW - 35, y: canvasElement.height / 2 - boxH / 2, w: boxW, h: boxH, title: "หน่วยส่งออก", sub: "(Output)" };

      drawTargetBox(leftBox, '#06b6d4', selectedBox === 'LEFT');
      drawTargetBox(rightBox, '#ec4899', selectedBox === 'RIGHT');

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0 && isPlaying) {
        const landmarks = results.multiHandLandmarks[0];
        const indexTip = landmarks[8];

        targetX = (1 - indexTip.x) * canvasElement.width;
        targetY = indexTip.y * canvasElement.height;

        // วาดจุดเคอร์เซอร์ปลายนิ้ว
        canvasCtx.beginPath();
        canvasCtx.arc(targetX, targetY, 16, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#facc15';
        canvasCtx.fill();
        canvasCtx.lineWidth = 4;
        canvasCtx.strokeStyle = '#ffffff';
        canvasCtx.stroke();

        let hovered = null;
        if (checkCollision(targetX, targetY, leftBox)) hovered = 'LEFT';
        else if (checkCollision(targetX, targetY, rightBox)) hovered = 'RIGHT';

        if (hovered) {
          if (selectedBox === hovered) {
            holdDuration++;
            drawProgressCircle(targetX, targetY, holdDuration / HOLD_THRESHOLD);
            if (holdDuration >= HOLD_THRESHOLD) {
              checkAnswer(hovered);
              holdDuration = 0;
              selectedBox = null;
            }
          } else {
            selectedBox = hovered;
            holdDuration = 1;
          }
        } else {
          selectedBox = null;
          holdDuration = 0;
        }
      }
    }

    function checkCollision(x, y, box) {
      // ขยายพื้นที่ชนเพิ่ม 15px ให้ชี้โดนง่ายขึ้น
      return x >= box.x - 15 && x <= box.x + box.w + 15 && y >= box.y - 15 && y <= box.y + box.h + 15;
    }

    function drawTargetBox(box, color, isHovered) {
      canvasCtx.save();
      if (isHovered) {
        canvasCtx.shadowColor = color;
        canvasCtx.shadowBlur = 18;
        canvasCtx.fillStyle = color;
        canvasCtx.strokeStyle = '#ffffff';
        canvasCtx.lineWidth = 5;
      } else {
        canvasCtx.fillStyle = 'rgba(15, 23, 42, 0.75)';
        canvasCtx.strokeStyle = color;
        canvasCtx.lineWidth = 3;
      }

      canvasCtx.beginPath();
      canvasCtx.roundRect(box.x, box.y, box.w, box.h, 18);
      canvasCtx.fill();
      canvasCtx.stroke();

      canvasCtx.shadowBlur = 0;
      canvasCtx.fillStyle = '#ffffff';
      canvasCtx.font = 'bold 22px sans-serif';
      canvasCtx.textAlign = 'center';
      canvasCtx.fillText(box.title, box.x + box.w / 2, box.y + 75);
      canvasCtx.font = '16px sans-serif';
      canvasCtx.fillStyle = isHovered ? '#ffffff' : '#cbd5e1';
      canvasCtx.fillText(box.sub, box.x + box.w / 2, box.y + 115);
      canvasCtx.restore();
    }

    function drawProgressCircle(x, y, progress) {
      canvasCtx.beginPath();
      canvasCtx.arc(x, y, 26, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * progress));
      canvasCtx.lineWidth = 6;
      canvasCtx.strokeStyle = '#22c55e';
      canvasCtx.stroke();
    }

    function checkAnswer(chosenSide) {
      const correct = currentQuestion.type === chosenSide;
      if (correct) {
        score += 10;
        playBeep(true);
      } else {
        score = Math.max(0, score - 5);
        playBeep(false);
      }
      scoreText.innerText = `⭐ คะแนน: ${score}`;
      nextQuestion();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0, // ลดภาระเครื่องให้เล่นได้ลื่นไหล ไม่กระตุก
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await hands.send({ image: videoElement }); },
      width: 1280,
      height: 720
    });

    startBtn.addEventListener('click', async () => {
      audioCtx.resume();
      startOverlay.style.display = 'none';
      await camera.start();
      isPlaying = true;
      nextQuestion();

      const timer = setInterval(() => {
        timeLeft--;
        timerText.innerText = `⏳ เวลา: ${formatTime(timeLeft)}`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          isPlaying = false;
          alert(`🎉 หมดเวลา 2 นาที!\nคุณทำคะแนนรวมได้: ${score} คะแนน`);
          location.reload();
        }
      }, 1000);
    });
  </script>
</body>
</html>
