<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกม AR จำแนกอุปกรณ์คอมพิวเตอร์</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a2e;
      color: #fff;
    }

    /* กล้องและ Canvas สลับซ้ายขวา (Mirror) เพื่อให้ควบคุมมือได้เป็นธรรมชาติ */
    #webcam-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    /* กล่องข้อความ UI */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 24px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
    }

    .question-box {
      align-self: center;
      background: rgba(15, 23, 42, 0.85);
      border: 3px solid #38bdf8;
      border-radius: 20px;
      padding: 20px 40px;
      text-align: center;
      margin-top: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .question-title { font-size: 18px; color: #94a3b8; margin-bottom: 6px; }
    .item-name { font-size: 34px; font-weight: 800; color: #facc15; }

    /* ปุ่มเริ่มต้นเกม */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 15, 30, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .start-btn {
      padding: 16px 40px;
      font-size: 24px;
      font-weight: bold;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5);
      transition: 0.2s;
    }
    .start-btn:hover { background: #0369a1; transform: scale(1.05); }
  </style>

  <!-- MediaPipe Hands CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="webcam-container">
    <video id="webcam" autoplay playsinline></video>
  </div>
  <canvas id="gameCanvas"></canvas>

  <div id="ui-layer">
    <div class="top-bar">
      <div id="score-text">⭐ คะแนน: 0</div>
      <div id="timer-text">⏳ เวลา: 60 วิ</div>
    </div>
    <div class="question-box">
      <div class="question-title">อุปกรณ์นี้เป็นประเภทใด?</div>
      <div class="item-name" id="current-item">เตรียมตัว...</div>
    </div>
    <div></div> <!-- เว้นพื้นที่ด้านล่าง -->
  </div>

  <div id="start-overlay">
    <h1 style="font-size: 36px; margin-bottom: 10px;">🎮 เกม AR ฮาร์ดแวร์คอมพิวเตอร์</h1>
    <p style="font-size: 18px; color: #cbd5e1; margin-bottom: 30px; text-align: center; max-width: 500px;">
      ยกนิ้วชี้ของคุณขึ้นมา แล้วชี้ไปที่กล่องคำตอบ <b>"หน่วยรับเข้า (Input)"</b> หรือ <b>"หน่วยส่งออก (Output)"</b> ให้ถูกต้อง!
    </p>
    <button class="start-btn" id="start-btn">เริ่มเล่นเกม</button>
  </div>

  <script>
    // ข้อมูลคำถามฮาร์ดแวร์คอมพิวเตอร์
    const questions = [
      { name: "แป้นพิมพ์ (Keyboard)", type: "LEFT" },
      { name: "จอภาพ (Monitor)", type: "RIGHT" },
      { name: "เมาส์ (Mouse)", type: "LEFT" },
      { name: "ลำโพง (Speaker)", type: "RIGHT" },
      { name: "ไมโครโฟน (Microphone)", type: "LEFT" },
      { name: "เครื่องพิมพ์ (Printer)", type: "RIGHT" },
      { name: "สแกนเนอร์ (Scanner)", type: "LEFT" },
      { name: "โปรเจกเตอร์ (Projector)", type: "RIGHT" },
      { name: "เว็บแคม (Webcam)", type: "LEFT" },
      { name: "หูฟัง (Headphone)", type: "RIGHT" }
    ];

    let score = 0;
    let timeLeft = 60;
    let isPlaying = false;
    let currentIndex = 0;
    let targetX = null, targetY = null;
    let holdDuration = 0; // ต้องชี้ค้างไว้เล็กน้อยเพื่อยืนยันคำตอบ
    const HOLD_THRESHOLD = 15; // เฟรม (~0.5 วินาที)
    let selectedBox = null;

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('gameCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const scoreText = document.getElementById('score-text');
    const timerText = document.getElementById('timer-text');
    const currentItemText = document.getElementById('current-item');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');

    // สร้างเสียงประกอบสังเคราะห์ (ไม่ต้องใช้ไฟล์เสียงภายนอก)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(isCorrect) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      if (isCorrect) {
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.1); // A5
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else {
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function nextQuestion() {
      currentIndex = Math.floor(Math.random() * questions.length);
      currentItemText.innerText = questions[currentIndex].name;
    }

    function onResults(results) {
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // กำหนดตำแหน่งกล่องตัวเลือก ซ้าย (Input) และ ขวา (Output)
      const boxW = Math.min(220, canvasElement.width * 0.28);
      const boxH = 180;
      const leftBox = { x: 30, y: canvasElement.height / 2 - boxH / 2, w: boxW, h: boxH, title: "หน่วยรับเข้า", sub: "(Input)" };
      const rightBox = { x: canvasElement.width - boxW - 30, y: canvasElement.height / 2 - boxH / 2, w: boxW, h: boxH, title: "หน่วยส่งออก", sub: "(Output)" };

      // วาดกล่องคำตอบซ้าย (สีเขียว-ฟ้า)
      drawTargetBox(leftBox, '#06b6d4', selectedBox === 'LEFT');
      // วาดกล่องคำตอบขวา (สีชมพู-ม่วง)
      drawTargetBox(rightBox, '#ec4899', selectedBox === 'RIGHT');

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0 && isPlaying) {
        const landmarks = results.multiHandLandmarks[0];
        const indexTip = landmarks[8]; // ตำแหน่งปลายนิ้วชี้

        // คำนวณพิกัดให้ตรงกับกล้องที่พลิกกลับด้าน (Mirror)
        targetX = (1 - indexTip.x) * canvasElement.width;
        targetY = indexTip.y * canvasElement.height;

        // วาดพอยน์เตอร์ตำแหน่งปลายนิ้ว
        canvasCtx.beginPath();
        canvasCtx.arc(targetX, targetY, 18, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#facc15';
        canvasCtx.fill();
        canvasCtx.lineWidth = 4;
        canvasCtx.strokeStyle = '#ffffff';
        canvasCtx.stroke();

        // เช็กการชนกับกล่องซ้าย / ขวา
        let hovered = null;
        if (checkCollision(targetX, targetY, leftBox)) hovered = 'LEFT';
        else if (checkCollision(targetX, targetY, rightBox)) hovered = 'RIGHT';

        if (hovered) {
          if (selectedBox === hovered) {
            holdDuration++;
            // หลอดวงกลมสะสมการค้างนิ้ว
            drawProgressCircle(targetX, targetY, holdDuration / HOLD_THRESHOLD);
            if (holdDuration >= HOLD_THRESHOLD) {
              checkAnswer(hovered);
              holdDuration = 0;
              selectedBox = null;
            }
          } else {
            selectedBox = hovered;
            holdDuration = 1;
          }
        } else {
          selectedBox = null;
          holdDuration = 0;
        }
      }
    }

    function checkCollision(x, y, box) {
      return x >= box.x && x <= box.x + box.w && y >= box.y && y <= box.y + box.h;
    }

    function drawTargetBox(box, color, isHovered) {
      canvasCtx.save();
      canvasCtx.fillStyle = isHovered ? color : 'rgba(15, 23, 42, 0.7)';
      canvasCtx.strokeStyle = color;
      canvasCtx.lineWidth = isHovered ? 6 : 3;
      canvasCtx.beginPath();
      canvasCtx.roundRect(box.x, box.y, box.w, box.h, 16);
      canvasCtx.fill();
      canvasCtx.stroke();

      canvasCtx.fillStyle = '#ffffff';
      canvasCtx.font = 'bold 22px sans-serif';
      canvasCtx.textAlign = 'center';
      canvasCtx.fillText(box.title, box.x + box.w / 2, box.y + 70);
      canvasCtx.font = '16px sans-serif';
      canvasCtx.fillStyle = '#cbd5e1';
      canvasCtx.fillText(box.sub, box.x + box.w / 2, box.y + 110);
      canvasCtx.restore();
    }

    function drawProgressCircle(x, y, progress) {
      canvasCtx.beginPath();
      canvasCtx.arc(x, y, 28, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * progress));
      canvasCtx.lineWidth = 6;
      canvasCtx.strokeStyle = '#22c55e';
      canvasCtx.stroke();
    }

    function checkAnswer(chosenSide) {
      const correct = questions[currentIndex].type === chosenSide;
      if (correct) {
        score += 10;
        playBeep(true);
      } else {
        score = Math.max(0, score - 5);
        playBeep(false);
      }
      scoreText.innerText = `⭐ คะแนน: ${score}`;
      nextQuestion();
    }

    // ตั้งค่าโมเดล MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await hands.send({ image: videoElement }); },
      width: 1280,
      height: 720
    });

    startBtn.addEventListener('click', async () => {
      audioCtx.resume();
      startOverlay.style.display = 'none';
      await camera.start();
      isPlaying = true;
      nextQuestion();

      // ตัวจับเวลาถอยหลัง
      const timer = setInterval(() => {
        timeLeft--;
        timerText.innerText = `⏳ เวลา: ${timeLeft} วิ`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          isPlaying = false;
          alert(`🎉 หมดเวลา! คะแนนรวมของคุณคือ: ${score} คะแนน`);
          location.reload();
        }
      }, 1000);
    });
  </script>
</body>
</html>
